name: Build & Release Android TV APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versión del Release (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar APK Release y Publicar en GitHub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle con caché
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Generar Keystore de firma si no existe
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=TVLocalWeb, OU=AndroidTV, O=VisorLocalUSB, L=Ciudad, S=Estado, C=ES"
          fi

      - name: 5. Compilar APK Release y Debug
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: androidrelease
          KEY_PASSWORD: androidrelease
        run: |
          gradle assembleRelease assembleDebug

      - name: 6. Empaquetar MEMORIA_USB de ejemplo para negocios (.zip)
        run: |
          mkdir -p dist_release
          cp app/build/outputs/apk/release/app-release.apk dist_release/VisorLocalUSB-AndroidTV-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist_release/VisorLocalUSB-AndroidTV-debug.apk

      - name: 7. Subir APKs como Artefactos de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VisorLocalUSB-AndroidTV-APKs
          path: |
            dist_release/VisorLocalUSB-AndroidTV-release.apk
            dist_release/VisorLocalUSB-AndroidTV-debug.apk

      - name: 8. Publicar en GitHub Releases (Descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.0-latest' }}
          name: "Visor Local USB - Android TV Release (${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.0' }})"
          body: |
            ## 📺 Visor Local USB (`TVLocalWeb`) — Descarga Directa APK
            Visor nativo para televisores Android TV (API 23 / Android 6.0+) y dispositivos Android con soporte de streaming en bloques de 8 KB desde memorias USB y paquetes `.zip` sin conexión a internet.

            ### 📦 Archivos incluidos para descargar:
            - **`VisorLocalUSB-AndroidTV-release.apk`**: APK compilada, firmada y lista para instalar en el televisor vía memoria USB o ADB (`adb install -r VisorLocalUSB-AndroidTV-release.apk`).
            - **`VisorLocalUSB-AndroidTV-debug.apk`**: Versión de pruebas y depuración.
          files: |
            dist_release/VisorLocalUSB-AndroidTV-release.apk
            dist_release/VisorLocalUSB-AndroidTV-debug.apk
          draft: false
          prerelease: false
